name: core

on:
  push:
    paths: ["core/**", "tools/build/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["core/**", "tools/build/**", ".github/workflows/ci.yml"]

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-socket lua-filesystem mosquitto lua-check python3-pip
          sudo pip3 install --break-system-packages "paho-mqtt>=2"   # the apt package is 1.x (no CallbackAPIVersion)
      - name: Unit specs
        run: lua5.1 core/spec/run.lua
      - name: Lint (no globals, no unused)
        run: luacheck core
      - name: Build (size budget)
        run: python3 tools/build/bundle.py --max-kib 176 && python3 tools/build/bundle.py --without services.streaming --out /tmp/lean
      - name: Broker
        run: |
          sudo systemctl stop mosquitto || true     # the apt package starts a system broker on 1883 (no websockets)
          printf 'listener 1883 127.0.0.1\nallow_anonymous true\nlistener 8000\nprotocol websockets\n' > /tmp/m.conf
          mosquitto -c /tmp/m.conf -d
          sleep 1
      - name: Bus integration
        run: lua5.1 core/spec/run.lua core/spec/integration/bus_spec.lua
      - name: Smoke (boot, contract, budgets)
        run: python3 core/spec/integration/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-build
          path: build/

  # The 1.x bench suites (written for the patched Muuselabs program) run unchanged against the new core:
  # this is the oracle of docs/21 §14.
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: core
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw   # installed with sudo, used by the bench as root: one path for both
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-socket lua-filesystem mosquitto ffmpeg python3-pip
          sudo pip3 install --break-system-packages "paho-mqtt>=2" playwright
          sudo -E python3 -m playwright install --with-deps chromium
      - name: Build the core
        run: python3 tools/build/bundle.py
      - name: "Bench as root (it creates /jooki, /data/mode, /tmp/web_ctrl_dirs like the device)"
        env:
          CORE_BUILD: ${{ github.workspace }}/build
          PLAYER_LUA: core
        run: |
          sudo systemctl stop mosquitto || true     # the apt package starts a system broker on 1883 (no websockets)
          cd tools/openjooki/tests
          chmod +x *.sh
          sudo -E bash -c './make_media.sh >/dev/null && ./up.sh >/dev/null && sleep 1 \
            && python3 test_backend.py && python3 test_bedtime.py && python3 test_net.py && python3 e2e.py \
            && python3 ../../../core/spec/integration/endurance.py 3'
      - name: Bench logs (on failure)
        if: failure()
        run: |
          for f in /tmp/player.log /tmp/mosq.log /tmp/webctrl.log /tmp/fakeaudio.log; do echo "=== $f"; sudo tail -n 40 $f 2>/dev/null; done
          echo "=== web dirs"; sudo ls -la /tmp/web_ctrl_dirs/ /tmp/web_ctrl_dirs/public/ 2>&1 | head -30
          echo "=== listeners"; sudo ss -ltnp | grep -E ':(1883|8000|8080) ' || true
          mosquitto -h | head -1
