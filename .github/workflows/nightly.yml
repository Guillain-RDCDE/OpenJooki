name: nightly

# The long run: the whole bench plus the endurance test (memory, shell processes and bus traffic of
# the core over time). Every night, on every release tag, or by hand.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PLAYWRIGHT_BROWSERS_PATH: /opt/pw
  CORE_BUILD: ${{ github.workspace }}/build
  PLAYER_LUA: core

jobs:
  endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/openjooki/tests
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bench
      - name: Unit specs and smoke, as a reminder of the day
        working-directory: .
        # smoke as root like the suites after it: /tmp is sticky, and root may not overwrite a log
        # file (bench_vol.log) that another user created there
        run: lua5.1 core/spec/run.lua && sudo -E python3 core/spec/integration/smoke.py
      - name: The bench suites, in CI order
        run: |
          sudo -E bash -c 'python3 test_backend.py && python3 test_bedtime.py && python3 test_net.py \
            && python3 test_security_backend.py && python3 e2e.py && python3 test_security.py && python3 test_spotify.py \
            && python3 test_robustness.py && python3 test_loader.py && python3 test_httpd.py && python3 test_clock.py \
            && python3 test_wifi_page.py'
      - name: Endurance (10 minutes)
        run: sudo -E python3 ../../../core/spec/integration/endurance.py 10
      - name: Bench logs (on failure)
        if: failure()
        run: for f in /tmp/player.log /tmp/mosq.log /tmp/fakeaudio.log; do echo "=== $f"; sudo tail -n 60 $f 2>/dev/null; done
