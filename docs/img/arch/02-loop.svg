<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Event loop"><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;fill:#222}
.t{font-weight:700;font-size:15px}.s{font-size:12px;fill:#555}.h{font-weight:700;font-size:17px}
.box{stroke:#333;stroke-width:1.2}.dash{stroke-dasharray:6 4}
.arrow{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
.arrow2{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#b)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10z" fill="#333"/></marker></defs><rect width="960" height="380" fill="#fff"/><text x="20" y="30" text-anchor="start" class="h">One loop, one clock, one queue: how the core runs</text>
<rect x="30" y="70" width="190" height="60" rx="10" fill="#e9e9e9" class="box"/>
<text x="125" y="92" text-anchor="middle" class="t">Bus messages</text>
<text x="125" y="108" text-anchor="middle" class="s">from daemons and page</text>
<rect x="30" y="150" width="190" height="60" rx="10" fill="#e9e9e9" class="box"/>
<text x="125" y="172" text-anchor="middle" class="t">Timers</text>
<text x="125" y="188" text-anchor="middle" class="s">bedtime tick, health,</text>
<text x="125" y="203" text-anchor="middle" class="s">autosave, inactivity</text>
<rect x="30" y="230" width="190" height="60" rx="10" fill="#e9e9e9" class="box"/>
<text x="125" y="252" text-anchor="middle" class="t">Signals</text>
<text x="125" y="268" text-anchor="middle" class="s">stop request from host</text>
<rect x="290" y="130" width="170" height="100" rx="10" fill="#fbe3cf" class="box"/>
<text x="375" y="172" text-anchor="middle" class="t">Queue</text>
<text x="375" y="188" text-anchor="middle" class="s">events, in order</text>
<text x="375" y="203" text-anchor="middle" class="s">nothing runs in parallel</text>
<path d="M220 100 L290 150" class="arrow"/>
<path d="M220 180 L290 180" class="arrow"/>
<path d="M220 260 L290 210" class="arrow"/>
<rect x="530" y="110" width="200" height="140" rx="10" fill="#fbe3cf" class="box"/>
<text x="630" y="172" text-anchor="middle" class="t">Dispatcher</text>
<text x="630" y="188" text-anchor="middle" class="s">one handler per event type</text>
<text x="630" y="203" text-anchor="middle" class="s">each call protected (pcall)</text>
<text x="630" y="218" text-anchor="middle" class="s">failure → logged + isolated</text>
<text x="630" y="233" text-anchor="middle" class="s">never stops the loop</text>
<path d="M460 180 L530 180" class="arrow"/>
<rect x="790" y="70" width="150" height="60" rx="10" fill="#e9e9e9" class="box"/>
<text x="865" y="92" text-anchor="middle" class="t">Commands</text>
<text x="865" y="108" text-anchor="middle" class="s">to daemons (bus)</text>
<rect x="790" y="150" width="150" height="60" rx="10" fill="#dfeef8" class="box"/>
<text x="865" y="172" text-anchor="middle" class="t">State</text>
<text x="865" y="188" text-anchor="middle" class="s">revision n+1, published</text>
<text x="865" y="203" text-anchor="middle" class="s">to the page</text>
<rect x="790" y="230" width="150" height="60" rx="10" fill="#dfeef8" class="box"/>
<text x="865" y="252" text-anchor="middle" class="t">Files</text>
<text x="865" y="268" text-anchor="middle" class="s">atomic writes</text>
<path d="M730 180 L790 100" class="arrow"/>
<path d="M730 180 L790 180" class="arrow"/>
<path d="M730 180 L790 260" class="arrow"/>
<text x="30" y="330" text-anchor="start" class="s">Rule: a handler is a pure function of (state, event) → (new state, commands). No handler reads the clock, the files</text>
<text x="30" y="347" text-anchor="start" class="s">or the network directly: it receives what it needs and returns what must be done. That is what makes it testable.</text></svg>