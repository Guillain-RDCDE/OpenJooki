<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="Modules"><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;fill:#222}
.t{font-weight:700;font-size:15px}.s{font-size:12px;fill:#555}.h{font-weight:700;font-size:17px}
.box{stroke:#333;stroke-width:1.2}.dash{stroke-dasharray:6 4}
.arrow{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
.arrow2{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#b)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10z" fill="#333"/></marker></defs><rect width="960" height="610" fill="#fff"/><text x="20" y="30" text-anchor="start" class="h">Modules and the only dependency rule: arrows go down, never up</text>
<rect x="30" y="60" width="900" height="70" rx="10" fill="#fbe3cf" class="box"/>
<text x="480" y="87" text-anchor="middle" class="t">api  —  v1 (what the page speaks) and v2 (schema-validated), bus_events, schema</text>
<text x="480" y="103" text-anchor="middle" class="s">turns bus messages into events, checks the parent code, maps a message to a service, publishes state and typed errors</text>
<rect x="30" y="160" width="900" height="255" rx="10" fill="#fdf1e6" class="box dash"/>
<text x="480" y="287" text-anchor="middle" class="t"></text>
<text x="45" y="182" text-anchor="start" class="t">services (pure handlers, no I/O) — one file each; device/ and playback/ have sub-modules</text>
<rect x="45" y="200" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="113" y="239" text-anchor="middle" class="t">library</text>
<text x="113" y="255" text-anchor="middle" class="s">playlists, tracks,</text>
<text x="113" y="270" text-anchor="middle" class="s">tokens, unused</text>
<rect x="193" y="200" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="261" y="239" text-anchor="middle" class="t">tokens</text>
<text x="261" y="255" text-anchor="middle" class="s">NFC → character</text>
<text x="261" y="270" text-anchor="middle" class="s">→ playlist</text>
<rect x="341" y="200" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="409" y="239" text-anchor="middle" class="t">playback</text>
<text x="409" y="255" text-anchor="middle" class="s">state machine</text>
<text x="409" y="270" text-anchor="middle" class="s">+ sounds, resume,</text>
<text x="409" y="285" text-anchor="middle" class="s">queue</text>
<rect x="489" y="200" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="557" y="239" text-anchor="middle" class="t">device</text>
<text x="557" y="255" text-anchor="middle" class="s">volume, ESP32</text>
<text x="557" y="270" text-anchor="middle" class="s">+ lights, power,</text>
<text x="557" y="285" text-anchor="middle" class="s">radio, buttons</text>
<rect x="637" y="200" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="705" y="239" text-anchor="middle" class="t">uploads</text>
<text x="705" y="255" text-anchor="middle" class="s">page file →</text>
<text x="705" y="270" text-anchor="middle" class="s">checked track</text>
<rect x="785" y="200" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="853" y="239" text-anchor="middle" class="t">bedtime</text>
<text x="853" y="255" text-anchor="middle" class="s">sleep timer, fade,</text>
<text x="853" y="270" text-anchor="middle" class="s">night window</text>
<rect x="45" y="305" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="113" y="344" text-anchor="middle" class="t">network</text>
<text x="113" y="360" text-anchor="middle" class="s">Wi-Fi state,</text>
<text x="113" y="375" text-anchor="middle" class="s">watchdog</text>
<rect x="193" y="305" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="261" y="344" text-anchor="middle" class="t">bluetooth</text>
<text x="261" y="360" text-anchor="middle" class="s">speaker,</text>
<text x="261" y="375" text-anchor="middle" class="s">headphones</text>
<rect x="341" y="305" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="409" y="344" text-anchor="middle" class="t">security</text>
<text x="409" y="360" text-anchor="middle" class="s">parent code, SSH,</text>
<text x="409" y="375" text-anchor="middle" class="s">MQTT on the LAN</text>
<rect x="489" y="305" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="557" y="344" text-anchor="middle" class="t">update</text>
<text x="557" y="360" text-anchor="middle" class="s">check, start</text>
<text x="557" y="375" text-anchor="middle" class="s">(GitHub)</text>
<rect x="637" y="305" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="705" y="344" text-anchor="middle" class="t">streaming</text>
<text x="705" y="360" text-anchor="middle" class="s">Spotify, Deezer</text>
<text x="705" y="375" text-anchor="middle" class="s">(optional)</text>
<rect x="785" y="305" width="136" height="95" rx="10" fill="#fbe3cf" class="box"/>
<text x="853" y="344" text-anchor="middle" class="t">util</text>
<text x="853" y="360" text-anchor="middle" class="s">pure helpers</text>
<rect x="30" y="440" width="430" height="110" rx="10" fill="#e9e9e9" class="box"/>
<text x="245" y="487" text-anchor="middle" class="t">adapters (all I/O lives here)</text>
<text x="245" y="503" text-anchor="middle" class="s">bus + mqtt_codec (MQTT)  ·  files (atomic JSON)  ·  clock</text>
<text x="245" y="518" text-anchor="middle" class="s">host (ALSA, syslog)  ·  shell (named actions)  ·  mdns (UDP)</text>
<text x="245" y="533" text-anchor="middle" class="s">httpd (the page, /upload)  ·  broker_watch</text>
<rect x="500" y="440" width="430" height="110" rx="10" fill="#fbe3cf" class="box"/>
<text x="715" y="487" text-anchor="middle" class="t">kernel</text>
<text x="715" y="503" text-anchor="middle" class="s">loop, dispatch, timers (by name), commands,</text>
<text x="715" y="518" text-anchor="middle" class="s">state (rev, coalesced publication), log, config</text>
<path d="M480 130 L480 160" class="arrow"/>
<path d="M245 415 L245 440" class="arrow"/>
<path d="M715 415 L715 440" class="arrow"/>
<text x="30" y="572" text-anchor="start" class="s">Test rule: a service is tested with fake adapters (core/fakes: clock, bus, files, host, shell).</text>
<text x="30" y="589" text-anchor="start" class="s">The adapters&#x27; pure parts have unit specs; the bus client is tested against a real mosquitto.</text></svg>