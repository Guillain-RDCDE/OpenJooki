<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Wi-Fi safe switch"><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;fill:#222}
.t{font-weight:700;font-size:15px}.s{font-size:12px;fill:#555}.h{font-weight:700;font-size:17px}
.box{stroke:#333;stroke-width:1.2}.dash{stroke-dasharray:6 4}
.arrow{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
.arrow2{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#b)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10z" fill="#333"/></marker></defs><rect width="960" height="300" fill="#fff"/><text x="20" y="30" text-anchor="start" class="h">Changing access point without ever losing the Jooki</text>
<rect x="30" y="80" width="170" height="90" rx="10" fill="#fbe3cf" class="box"/>
<text x="115" y="117" text-anchor="middle" class="t">1. keep</text>
<text x="115" y="133" text-anchor="middle" class="s">the working network</text>
<text x="115" y="148" text-anchor="middle" class="s">stays configured</text>
<path d="M200 125 L216 125" class="arrow"/>
<rect x="216" y="80" width="170" height="90" rx="10" fill="#fbe3cf" class="box"/>
<text x="301" y="117" text-anchor="middle" class="t">2. add</text>
<text x="301" y="133" text-anchor="middle" class="s">the new network is</text>
<text x="301" y="148" text-anchor="middle" class="s">added, not swapped</text>
<path d="M386 125 L402 125" class="arrow"/>
<rect x="402" y="80" width="170" height="90" rx="10" fill="#fbe3cf" class="box"/>
<text x="487" y="117" text-anchor="middle" class="t">3. try</text>
<text x="487" y="133" text-anchor="middle" class="s">when idle: connect</text>
<text x="487" y="148" text-anchor="middle" class="s">to the new one</text>
<path d="M572 125 L588 125" class="arrow"/>
<rect x="588" y="80" width="170" height="90" rx="10" fill="#fbe3cf" class="box"/>
<text x="673" y="117" text-anchor="middle" class="t">4. prove</text>
<text x="673" y="133" text-anchor="middle" class="s">IP + page reachable</text>
<text x="673" y="148" text-anchor="middle" class="s">for 2 minutes</text>
<path d="M758 125 L774 125" class="arrow"/>
<rect x="774" y="80" width="170" height="90" rx="10" fill="#fbe3cf" class="box"/>
<text x="859" y="117" text-anchor="middle" class="t">5. prefer</text>
<text x="859" y="133" text-anchor="middle" class="s">new one becomes</text>
<text x="859" y="148" text-anchor="middle" class="s">the first choice</text>
<path d="M680 170 L680 220 L300 220 L300 170" class="arrow"/>
<rect x="147" y="202" width="304" height="19" fill="#fff" rx="3"/>
<text x="300" y="214" text-anchor="middle" class="s">not proved → back to the old one, nothing lost</text>
<text x="30" y="270" text-anchor="start" class="s">Still offline? Bluetooth rescue: the Jooki advertises its provisioning service; a computer or Android phone scans and gives it a network (docs/20).</text></svg>