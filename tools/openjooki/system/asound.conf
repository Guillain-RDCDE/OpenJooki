# /etc/asound.conf of the 1.3.0 image, plus softvol_spk: the speaker goes through the "Softmaster"
# control too, so that the page, night mode and fades can lower it. 0.4 dB a step, as the ESP32's dial.
pcm.!default {
  type plug
  slave.pcm       "speaker"
}
pcm.headphones {
  type plug
  slave.pcm       "softvol_hp"
}
pcm.softvol_hp {
  type            softvol
  slave {
    pcm         "headphones_dmix"
  }
  control {
    name        "Softmaster"
    card        0
  }
  min_dB -50.0
  max_dB -3.0
  toysafe_factor 0.3
  resolution 101
}
pcm.headphones_dmix  {
  type dmix
  ipc_key 1024
  slave {
    pcm "hw:0,0"
    period_time 0
    period_size 256
    buffer_size 4096
    rate 44100
  }
  bindings {
    0 0
    1 1
  }
}
ctl.speaker {
  type hw
  card 0
}
pcm.speaker {
  type plug
  slave.pcm       "softvol_spk"
}
pcm.softvol_spk {
  type            softvol
  slave {
    pcm         "speaker_dmix"
  }
  control {
    name        "Softmaster"
    card        0
  }
  min_dB -40.0
  max_dB 0.0
  resolution 101
}
pcm.speaker_dmix  {
  type dmix
  ipc_key 1025
  slave {
    pcm "hw:1,0"
    period_time 0
    period_size 256
    buffer_size 4096
    rate 44100
  }
  bindings {
    0 0
    1 1
  }
}
