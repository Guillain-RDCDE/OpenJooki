# OpenJooki broker configuration (docs/adr/0007-security-model).
#
# Local clients (the core and the closed hardware daemons) talk to the broker
# on 127.0.0.1:1883 without a password, exactly as before. The page reaches the
# broker over the WebSocket on 8000, which now requires a per-Jooki password.
#
# The 1883 listener is the *default* listener (port + bind_address), on purpose:
# with per_listener_settings, mosquitto 1.6 otherwise also opens a second,
# all-interfaces listener on 1883 that would defeat the localhost bind. The
# password lives in /etc/mosquitto/passwd, (re)built at every boot by
# /etc/rcS.d/S57_oj-security.sh before this broker starts (S58). That script
# also serves the password to the page at /oj-auth.json (same origin only) and,
# when the owner turns it on, appends a network MQTT listener for home
# automation. This file is the safe default the broker starts from.
per_listener_settings true
socket_domain ipv4
persistence false
log_dest stderr
log_type error
log_type warning
log_type notice

# local only: the core, the player and the ESP32/GPIO daemons (anonymous)
port 1883
bind_address 127.0.0.1
allow_anonymous true

# the page, over the network: WebSocket, password required
listener 8000
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd
