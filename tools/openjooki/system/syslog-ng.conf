@version: 3.24
# OpenJooki — the Jooki's logs stay on the Jooki.
#  * the original configuration also sent every log line to Muuselabs' account
#    at logs6.papertrailapp.com (playlist and token names, Wi-Fi name...):
#    removed;
#  * one file per weekday, overwritten after 6 days: a week of history at most,
#    instead of one file growing forever on the memory card;
#  * the Wi-Fi driver's block-ack chatter (most of the volume) is dropped;
#  * Wi-Fi connection events are also copied to /tmp/oj-wifi.log (RAM), read by
#    the application to show the connection quality on the page.
options {
  chain_hostnames(off);
  flush_lines(10);
  use_dns(no);
  dns_cache(no);
  use_fqdn(no);
  owner("root");
  group("adm");
  perm(0640);
  stats_freq(0);
  bad_hostname("^gconfd$");
  log-fifo-size(1000);
  log-msg-size(1024);
  trim-large-messages(yes);
};
filter f_ignore { not (
       program("kernel") and level(debug..warning);
       or program("audio_ctrl") and (
          match("AES0 0x02 AES1 0x82 AES2 0x00 AES3 0x02" value("MESSAGE"))
          or match("Cannot read Channel Map ctl" value("MESSAGE"))
          or match("No such file or directory" value("MESSAGE"))
          );
       or program("systemd") and level(debug..notice);
       or program("esp_tty") and match("wifi:<ba-(add|del)>" value("MESSAGE"));
       )
};
filter f_wifi { program("esp_tty") and match("wifi:connected with|wifi:state: run -> init|bcn_timout" value("MESSAGE")); };
destination d_file { file("/jooki/external/logs/syslog-ng/jooki-${WEEKDAY}.log" overwrite-if-older(518400)); };
destination d_wifi { file("/tmp/oj-wifi.log"); };
source s_local {
    system(); internal();
};
log {
  source(s_local);
  filter(f_ignore);
  destination(d_file);
};
log {
  source(s_local);
  filter(f_wifi);
  destination(d_wifi);
};
